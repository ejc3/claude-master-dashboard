name: Deploy

# Builds apps/web as a Cloudflare Worker (OpenNext) and deploys it as claude-master-dashboard.
# Cloudflare Access gates the Worker (an Access application with the Worker as its destination,
# managed in ejc3/aws), and the app refuses any request without a valid Access assertion.
#
# The deploy token lives in the "production" environment, whose deployment-branch policy admits
# main only, so no other branch, workflow or fork can read it. This workflow runs only on a push
# to main or by hand on main; never on pull_request, pull_request_target or workflow_run. Every
# action is pinned to a commit: a moved tag must not run on the runner that later holds the token.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue behind each other and are never cancelled half way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    # GitHub-hosted: this repository is public, so it never uses self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same gate as CI, on the commit being deployed: a red commit never deploys.
      - name: Check
        run: pnpm exec biome ci . && pnpm typecheck && pnpm test
      - name: Build the Worker
        run: pnpm --filter web cf:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # OpenNext embeds apps/web/.env* files in the Worker; CI has none, and none may appear.
      - name: Nothing from an env file is embedded
        run: |
          node -e "import('./apps/web/.open-next/cloudflare/next-env.mjs').then((m) => { const p = m.production ?? {}; if (Object.keys(p).length) { console.error('embedded env:', Object.keys(p)); process.exit(1) } })"
      - name: Deploy claude-master-dashboard
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Not deployed: the production environment has no CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable yet (docs/deploy.md)."
            echo "### Not deployed: no deploy credentials in the production environment yet" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm exec wrangler deploy
