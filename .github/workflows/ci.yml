name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format + lint (biome)
        run: pnpm exec biome ci .
      # Builds the reference app as the Cloudflare Worker it deploys as, and dry-runs the deploy.
      - name: Build the Worker
        run: pnpm --filter web cf:check
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
